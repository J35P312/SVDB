name: CI

on: ["push", "pull_request"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  tests:

    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:

      - uses: actions/checkout@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install package and run unit tests
        run: |
          pip install .
          pip install -r requirements-dev.txt
          pytest --cov=svdb --cov-report xml

      - name: Performance timing table (fixture VCFs)
        run: |
          python - <<'EOF'
          import subprocess, sys, time, pathlib, tempfile

          SVDB = [sys.executable, "-m", "svdb"]
          F = "tests/fixtures"
          MANTA  = f"{F}/manta_chr1_del.vcf"
          TIDDIT = f"{F}/tiddit_chr1_del.vcf"
          TRUTH  = f"{F}/truth_chr1_del.vcf"

          def timed(args, n=3):
              times = []
              for _ in range(n):
                  t0 = time.perf_counter()
                  subprocess.run(SVDB + args, capture_output=True)
                  times.append(time.perf_counter() - t0)
              return sum(times) / n

          with tempfile.TemporaryDirectory() as tmp:
              db_prefix = pathlib.Path(tmp) / "svdb"
              results = [
                  ("merge 2 VCFs",    timed(["--merge", "--vcf", MANTA, TIDDIT])),
                  ("merge 3 VCFs",    timed(["--merge", "--vcf", MANTA, TIDDIT, TRUTH])),
                  ("query vcf-db",    timed(["--query", "--db", TRUTH, "--query_vcf", MANTA])),
                  ("build",           timed(["--build", "--files", MANTA, TIDDIT, "--prefix", str(db_prefix)])),
                  ("export default",  timed(["--export", "--db", str(db_prefix) + ".db", "--prefix", str(pathlib.Path(tmp) / "out")])),
              ]

          print()
          print("=" * 44)
          print(f"  {'Command':<22}  {'Avg (3 runs)':>12}")
          print("=" * 44)
          for label, t in results:
              print(f"  {label:<22}  {t:>10.3f}s")
          print("=" * 44)
          print()
          EOF

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests

  security:

    name: Security checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:

      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Semgrep static analysis
        run: |
          pip install semgrep
          semgrep scan --config p/python --error .

      - name: GuardDog dependency scan
        continue-on-error: true
        run: |
          pip install guarddog
          grep -hv '^[[:space:]]*#\|^[[:space:]]*$' requirements.txt requirements-dev.txt \
            | sed 's/[=><].*//' | tr -d ' ' \
            | while read pkg; do guarddog pypi scan "$pkg"; done

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan for invisible Unicode characters
        run: |
          if grep -rP "[\x{200B}-\x{200D}\x{2060}\x{FEFF}]" \
               --include="*.py" --include="*.yml" --include="*.yaml" --include="*.toml" \
               --exclude-dir=".git" .; then
            echo "::error::Invisible Unicode characters detected"
            exit 1
          fi

      - name: Scan for dangerous Unicode sequences (Bidi controls)
        run: |
          if grep -rP "[\x{202A}-\x{202E}\x{2066}-\x{2069}]" \
               --include="*.py" --include="*.yml" --include="*.yaml" --include="*.toml" \
               --exclude-dir=".git" .; then
            echo "::error::Dangerous bidirectional Unicode control sequences detected"
            exit 1
          fi

